---
name: Builder

on:
  push:
    branches:
      - main
    tags:
      - "*"
    paths:
      - .github/workflows/builder.yaml
      - nightscout/**
      - nightscout_mongodb/**
      - nightscout_caddy/**
  pull_request:
    paths:
      - .github/workflows/builder.yaml
      - nightscout/**
      - nightscout_mongodb/**
      - nightscout_caddy/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Find add-ons to build
    runs-on: ubuntu-latest
    outputs:
      addons: ${{ steps.changes.outputs.addons }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compare with the previous commit
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          all='["nightscout","nightscout_mongodb","nightscout_caddy"]'
          # Tags, manual runs, new branches and rewritten history build everything
          if [ "$EVENT_NAME" = workflow_dispatch ] || [ "$REF_TYPE" = tag ] \
            || ! files=$(git diff --name-only "$BASE_SHA" HEAD) \
            || grep -qx '.github/workflows/builder.yaml' <<<"$files"; then
            addons=$all
          else
            addons=$(jq -cn --arg files "$files" --argjson all "$all" \
              '($files | split("\n") | map(split("/")[0])) as $dirs | $all | map(select(. as $a | $dirs | index($a)))')
          fi
          echo "addons=$addons" | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.addon }} (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.addons != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJSON(needs.changes.outputs.addons) }}
        arch:
          - aarch64
          - amd64
    env:
      # Only main and tags publish, so a manual run on a branch cannot move latest
      PUBLISH: >-
        ${{ github.event_name != 'pull_request'
        && (github.ref == 'refs/heads/main' || github.ref_type == 'tag') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Read add-on metadata
        id: meta
        env:
          ADDON: ${{ matrix.addon }}
          ARCH: ${{ matrix.arch }}
        run: |
          version=$(yq -r '.version' "$ADDON/config.yaml")
          image=$(yq -r '.image' "$ADDON/config.yaml")
          image=${image//\{arch\}/$ARCH}
          case "$ARCH" in
            aarch64) platform=linux/arm64 ;;
            amd64) platform=linux/amd64 ;;
            *) echo "::error::Unsupported architecture $ARCH"; exit 1 ;;
          esac
          {
            echo "version=$version"
            echo "platform=$platform"
            echo "tags=$image:$version,$image:latest"
          } | tee -a "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.addon }}
          platforms: ${{ steps.meta.outputs.platform }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          # Keep a plain single-platform image, which is what Supervisor pulls
          provenance: false
          labels: |
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.addon }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.addon }}-${{ matrix.arch }}
