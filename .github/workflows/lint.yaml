---
name: Lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  addon:
    name: Add-on ${{ matrix.addon }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon:
          - nightscout
          - nightscout_mongodb
          - nightscout_caddy
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Run add-on linter
        uses: frenck/action-addon-linter@v2
        with:
          path: ./${{ matrix.addon }}

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Run yamllint
        run: pipx run yamllint --strict .
