---
name: Update upstream versions

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Check upstream versions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Apply upstream updates
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/update.sh
      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          # GITHUB_TOKEN pull requests do not trigger the Builder and Lint checks
          token: ${{ secrets.UPDATE_TOKEN || github.token }}
          branch: automation/upstream-updates
          delete-branch: true
          commit-message: Update upstream versions
          title: Update upstream versions
          body: ${{ steps.update.outputs.summary }}
      - name: Report failed upstream checks
        if: steps.update.outputs.failed == 'true'
        run: |
          echo "::error::At least one upstream check failed, see the Apply upstream updates step"
          exit 1
